# Without this, `prek install` wires only the pre-commit stage and commit messages go unlinted.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/jdx/jactionlint
    rev: 1027f0a131ab98bc7e191d995bfa15dbed5bbf8f # frozen: v2.2.0
    hooks:
      - id: jactionlint

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: pnpm lint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
      - id: oxfmt
        name: oxfmt --check
        entry: pnpm format:check
        language: system
        types_or: [ts, tsx, javascript, jsx, json, yaml, css]
        pass_filenames: false
