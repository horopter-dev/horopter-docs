name: Tutorials

on:
  pull_request:
  push:
    branches: [main]
    paths: [versions]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tutorials-${{ github.ref }}
  # Only a newer push to a pull request supersedes a run; on main, a pin bump must not cancel
  # the weekly run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The harness proves itself on three fixtures: two it must pass and one it must fail.
  fixtures:
    name: Harness fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - name: Echo steps pass, listing the manual block as untested
        shell: bash
        run: |
          set -euo pipefail
          pnpm --silent tutorial scripts/tutorial/fixtures/echo.mdx | tee report.txt
          grep -F "echo.mdx: untested: manual block at line" report.txt
      - name: Setup's exports and directory reach the steps
        run: pnpm --silent tutorial scripts/tutorial/fixtures/setup.mdx
      - name: A wrong expect fails, naming its block
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --silent tutorial scripts/tutorial/fixtures/wrong-expect.mdx 2> report.txt; then
            echo "::error::the harness passed wrong-expect.mdx, whose second expect block is wrong"
            exit 1
          fi
          cat report.txt
          grep -F "wrong-expect.mdx: run block at line 14:" report.txt

  plan:
    name: Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tutorials: ${{ steps.tutorials.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pin naming no published image fails here, once, rather than in every Tutorial job.
      - name: Check the pinned release's image exists
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^HOROPTER_VERSION=//p' versions)
          image="ghcr.io/horopter-dev/horoctl:$version"
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "::error title=No image at the pin::$image is not published. Check versions."
            exit 1
          fi
      - name: List the tutorials
        id: tutorials
        shell: bash
        run: |
          set -euo pipefail
          # A page's run blocks may come from an included snippet, so a page with an include
          # is listed too; snippets themselves are not pages.
          pages=$(git grep -lE '^```bash run|^<include' -- 'content/docs/*.mdx' \
            | sort | jq -Rnc '[inputs]')
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "$pages"

  tutorial:
    name: Tutorial
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.plan.outputs.tutorials) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # The image has Homebrew but leaves it off PATH; the install snippet's Homebrew tab runs it.
      - name: Put Homebrew on PATH
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Run ${{ matrix.page }}
        shell: bash
        env:
          PAGE: ${{ matrix.page }}
        run: pnpm --silent tutorial "$PAGE"

  # The other pages need Docker, which macOS runners lack; the install how-to needs none, and
  # covers the darwin_arm64 tarball and the cask's macOS path, quarantine removal included.
  install-macos:
    name: Tutorial on macOS (content/docs/how-to/install-horo.mdx)
    needs: plan
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run content/docs/how-to/install-horo.mdx
        run: pnpm --silent tutorial content/docs/how-to/install-horo.mdx
