name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on a known vulnerability, moderate or worse, in any installed package.
      - run: pnpm audit --audit-level=moderate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm types:check
      - run: pnpm test
      - run: pnpm build

  # The hooks contributors run locally, less the two the site job already runs. They need
  # no Node, so this job installs only prek.
  hooks:
    name: Hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: prek
      - run: prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: oxlint,oxfmt
          # Turns on jactionlint's online rules; local runs stay offline.
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
