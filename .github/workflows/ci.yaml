name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on a known vulnerability, moderate or worse, in any installed package.
      - run: pnpm audit --audit-level=moderate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm types:check
      - run: pnpm test
      - run: pnpm build

  # The hooks contributors run locally, less the two the site job already runs. They need
  # no Node, so this job installs only prek.
  hooks:
    name: Hooks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: prek
      - run: prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: oxlint,oxfmt
